name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Swift version
        run: swift --version

      - name: Protocol layer
        run: |
          swift build
          swift run protocol-selftest

      - name: HID probe
        working-directory: tools/hid-probe
        run: |
          swift build
          swift run probe-selftest

      - name: Macro tool
        working-directory: tools/macro-tool
        run: swift build
